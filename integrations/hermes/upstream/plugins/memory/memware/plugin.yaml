name: memware
version: 1.0.0
description: "memware — local belief ledger that only returns the latest truth, plus a transcript index, in one SQLite file."
pip_dependencies:
  - memware
requires_env: []
hooks:
  - system_prompt_block
  - prefetch
  - sync_turn
  - on_session_end
  - on_session_switch
  - on_pre_compress
  - on_memory_write
