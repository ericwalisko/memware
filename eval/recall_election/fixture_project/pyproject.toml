[project]
name = "gateway"
version = "0.3.1"
description = "Edge gateway that fronts the internal job runner"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5,<0.6"]

[project.scripts]
gateway = "gateway.server:main"
# Legacy name, kept because the deployed systemd units still start the gateway as gateway-server;
# dropping it would break every host that has not had its unit file updated.
gateway-server = "gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
