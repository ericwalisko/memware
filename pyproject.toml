[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memware"
version = "0.1.0"
description = "Memory for AI agents that only remembers the latest truth: a bi-temporal belief ledger plus a transcript index, in one SQLite file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ericwalisko" }]
keywords = ["agent-memory", "llm", "sqlite", "fts5", "bitemporal", "claude-code", "hermes", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
memware = "memware.cli:main"
memware-mcp = "memware.mcp_server:main"
memware-eval = "memware.eval:main"

[project.urls]
Homepage = "https://github.com/ericwalisko/memware"
Issues = "https://github.com/ericwalisko/memware/issues"
Changelog = "https://github.com/ericwalisko/memware/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/memware"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "integrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
